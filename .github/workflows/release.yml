name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl
  LIBPCAP_VERSION: 1.10.5
  LIBPCAP_SHA256: 84fa89ac6d303028c1c5b754abff77224f45eca0a94eb1a34ff0aa9ceece3925

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools flex bison libpcap-dev linux-libc-dev
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      # El crate pcap enlaza libpcap: para que el binario siga siendo estatico
      # hay que compilarla como .a contra musl.
      - name: Build static libpcap (musl)
        run: |
          prefix="$RUNNER_TEMP/libpcap-musl"
          src="$RUNNER_TEMP/libpcap-src"
          mkdir -p "$src"
          curl -fsSL "https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.xz" -o "$src/libpcap.tar.xz"
          echo "${LIBPCAP_SHA256}  $src/libpcap.tar.xz" | sha256sum -c -
          tar -xJf "$src/libpcap.tar.xz" -C "$src"
          # musl-gcc no ve /usr/include: se exponen solo los headers del kernel.
          kh="$RUNNER_TEMP/kernel-headers"
          mkdir -p "$kh"
          ln -s /usr/include/linux "$kh/linux"
          ln -s /usr/include/asm-generic "$kh/asm-generic"
          ln -s /usr/include/x86_64-linux-gnu/asm "$kh/asm"
          cd "$src/libpcap-${LIBPCAP_VERSION}"
          CC=musl-gcc CFLAGS="-O2 -I$kh" ./configure --prefix="$prefix" \
            --disable-shared --without-libnl --disable-dbus --disable-rdma \
            --disable-bluetooth --disable-usb
          make -j"$(nproc)"
          make install
          echo "LIBPCAP_MUSL_DIR=$prefix/lib" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked

      - name: Build
        env:
          LIBPCAP_LIBDIR: ${{ env.LIBPCAP_MUSL_DIR }}
          LIBPCAP_VER: ${{ env.LIBPCAP_VERSION }}
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target "$TARGET"

      - name: Check binary is static
        run: |
          file "target/$TARGET/release/voxpbx-tui"
          if ldd "target/$TARGET/release/voxpbx-tui" 2>&1 | grep -q "=>"; then
            echo "El binario tiene dependencias dinamicas" >&2
            exit 1
          fi
          "target/$TARGET/release/voxpbx-tui" --version

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          name="voxpbx-tui-${tag}-x86_64-linux"
          mkdir -p "dist/${name}"
          cp "target/$TARGET/release/voxpbx-tui" README.md config/voxpbx.example.toml "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: voxpbx-tui
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" --generate-notes
